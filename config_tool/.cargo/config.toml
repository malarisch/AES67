# Cross-compilation linkers for Raspberry Pi targets.
#
# Install the matching GCC cross toolchain on the host, e.g. on Debian/Ubuntu:
#   sudo apt install gcc-aarch64-linux-gnu        # 64-bit Pi (3/4/5, Pi OS 64-bit)
#   sudo apt install gcc-arm-linux-gnueabihf      # 32-bit Pi (2/3/4 ARMv7)
#
# Then build with, e.g.:
#   cargo build --release --target aarch64-unknown-linux-gnu

[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"

[target.armv7-unknown-linux-gnueabihf]
linker = "arm-linux-gnueabihf-gcc"
