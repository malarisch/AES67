[package]
name = "aes67-daemon"
description = "AES67 control-plane daemon: owns the SPI/UART link, serves the control API"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "aes67d"
path = "src/main.rs"

[dependencies]
aes67-proto.workspace = true
aes67-config.workspace = true
aes67-sdp.workspace = true
aes67-sap.workspace = true
clap = { version = "4", features = ["derive"] }
anyhow = "1"
libc = "0.2"
gpio-cdev = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
aes67-client.workspace = true
aes67-transport = { workspace = true, features = ["mock"] }
