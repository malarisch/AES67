[package]
name = "aes67-mdns"
description = "mDNS / DNS-SD service announcement (and, later, discovery), pure Rust"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Pure-Rust mDNS/DNS-SD (no C libraries to link), so the tool keeps cross-
# compiling cleanly and needs no avahi-daemon at runtime. Also supports browsing,
# used for AES67 stream discovery.
mdns-sd = "0.20"
libc = "0.2"
thiserror.workspace = true
