# Software-PTP overlay: run PTP on the softcore with Zephyr's IEEE 1588 stack
# (CONFIG_PTP) disciplining the FPGA wallclock, instead of the FPGA hardware PTP.
#
# Requires an aes67_bridge gateware built with `--ptp-in-software`.
#
# Build, e.g.:
#   west build . -b litex_vexriscv_cyc1000 -d build-ptpsw -- -DEXTRA_CONF_FILE=ptpsw.conf
#
# CONFIG_PTP brings in NET_L2_PTP / NET_SOCKETS / EVENTFD itself; we add the PHC
# driver class and per-packet timestamping the aes67_eth driver needs.

CONFIG_PTP=y
CONFIG_PTP_CLOCK=y
CONFIG_NET_PKT_TIMESTAMP=y
CONFIG_AES67_PTP_SOFTWARE=y
