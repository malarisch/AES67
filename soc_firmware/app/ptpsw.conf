# Software-PTP overlay: run Zephyr's IEEE 1588 stack (CONFIG_PTP) disciplining
# the FPGA wallclock, instead of the FPGA hardware PTP. Works on the integrated
# softcore and on an external MCU over spibone (eth_spi).
#
# Requires gateware built with `--ptp-in-software` / PTP_IN_SOFTWARE=true
# (e.g. the c10_006 board top).
#
# Build, e.g.:
#   west build . -b litex_vexriscv_cyc1000 -d build-ptpsw -- -DEXTRA_CONF_FILE=ptpsw.conf
#   west build . -b esp32s3_devkitc/esp32s3/procpu -d build-esp32 -- -DEXTRA_CONF_FILE=ptpsw.conf
#
# CONFIG_PTP brings in NET_L2_PTP / NET_SOCKETS / EVENTFD itself; we add the PHC
# driver class and per-packet timestamping the Ethernet drivers need.

CONFIG_PTP=y
CONFIG_PTP_CLOCK=y
CONFIG_NET_PKT_TIMESTAMP=y
CONFIG_AES67_PTP_SOFTWARE=y

# PI servo gains (thousandths). The upstream defaults (700/300) are tuned for
# a 1 Hz sync interval; at the AES67 8 Hz rate they leave the loop barely
# damped (|z|≈0.96, ~4 s ringing) — visible as PPS frequency wander on a
# scope even with ns-level reported offsets. Softer gains trade lock speed
# (tens of seconds) for a clean, stable frequency.
CONFIG_PTP_SERVO_KP=100
CONFIG_PTP_SERVO_KI=10
