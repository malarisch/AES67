manifest:
  remotes:
    - name: zephyrproject
      url-base: https://github.com/zephyrproject-rtos
    # Our Zephyr fork: upstream main + the AES67 patch series (changelog in
    # soc_firmware/zephyr-patches/README.md). The modules imported below
    # still come from zephyrproject-rtos via Zephyr's own manifest.
    - name: malarisch
      url-base: https://github.com/malarisch
  projects:
    - name: zephyr
      repo-path: zephyr
      remote: malarisch
      # Branch `aes67` on the fork = upstream main snapshot (currently
      # 042104ba7e, 2026-09-09) + our patches already applied, so a plain
      # `west update` yields the patched tree — no `git am` needed.
      # The fork exists only for this project, so its branch tip is always
      # the intended state: follow the branch here. The exact commit a
      # given AES67 revision was built against is recorded by the
      # external/zephyr submodule gitlink (`git add external/zephyr` after
      # `west update` moved it).
      revision: aes67
      clone-depth: 1
      import:
        path-prefix: external
        # Only the modules our boards actually link — everything else in
        # Zephyr's manifest (vendor HALs, LoRa, crypto, ...) is dead
        # weight for this project and would be re-cloned on every CI run.
        # Extend when a new board/feature needs its module:
        #   picolibc      libc linked into every image
        #   fatfs         SD-card FAT (LiteX boards)
        #   hal_espressif ESP32-S3 external-MCU build
        name-allowlist:
          - picolibc
          - fatfs
          - hal_espressif
