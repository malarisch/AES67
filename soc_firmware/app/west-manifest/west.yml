manifest:
  remotes:
    - name: zephyrproject
      url-base: https://github.com/zephyrproject-rtos
  projects:
    - name: zephyr
      repo-path: zephyr
      remote: zephyrproject
      # Pinned main snapshot (2026-07-03): post-v4.4.1, includes the PTP
      # overhaul (configurable PI servo gains, uptime-based msg aging,
      # ingress-ts validity guards). Local patches live on branch
      # aes67/main-20260703 in external/zephyr — re-checkout after west update.
      revision: 8edca5b8df024f290d30daad028fd5e4488877bd
      clone-depth: 1
      import:
        path-prefix: external
        # Only the modules our boards actually link — everything else in
        # Zephyr's manifest (vendor HALs, LoRa, crypto, ...) is dead
        # weight for this project and would be re-cloned on every CI run.
        # Extend when a new board/feature needs its module:
        #   picolibc      libc linked into every image
        #   fatfs         SD-card FAT (LiteX boards)
        #   hal_espressif ESP32-S3 external-MCU build
        name-allowlist:
          - picolibc
          - fatfs
          - hal_espressif
