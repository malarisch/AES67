# Networking
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV4=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_DHCPV6=n
CONFIG_NET_UDP=y
CONFIG_NET_TCP=y
CONFIG_NET_STATISTICS=y
CONFIG_NET_LOG=y
CONFIG_NET_DHCPV4_LOG_LEVEL_INF=y
CONFIG_NET_IPV4_LOG_LEVEL_DBG=n
#CONFIG_NET_L2_PTP=y
#CONFIG_PTP=y
#CONFIG_PTP_CLOCK=y
#CONFIG_PTP_LOG_LEVEL_DBG=y
CONFIG_NET_CONNECTION_MANAGER=y
CONFIG_NET_SOCKETS=y

# System stack sizes
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# PTPv2 BMC - multicast support for Announce messages
CONFIG_NET_IPV4_IGMP=y

#CONFIG_NET_CONFIG_MY_IPV4_ADDR="10.42.0.44"


# Ethernet Driver (board-specific; see boards/*.conf)
CONFIG_ETHERNET_LOG_LEVEL_INF=y

# Network Shell
CONFIG_NET_SHELL=y
CONFIG_SHELL=y


CONFIG_LOG=y
CONFIG_NET_IF_MAX_IPV4_COUNT=1

# Early Console
CONFIG_EARLY_CONSOLE=y
CONFIG_PRINTK=y

CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_NAME=y

# Si5351A I2C Clock Generator
CONFIG_I2C=y
CONFIG_I2C_SHELL=y
CONFIG_SI5351A=y

# Analog I/O card drivers - all enabled so card_manager can detect and init
# the correct one at runtime based on I2C board ID.
CONFIG_MI_CARD=y
CONFIG_LO_CARD=y
CONFIG_IO_CARD=y

# Display Controller (LEDs, Buttons, 7-Segment via UART)
CONFIG_UART_INTERRUPT_DRIVEN=n
CONFIG_DISPLAY_CTRL=y
# CONFIG_DISPLAY_CTRL_AUTO_SYNC_MI_CARD=y

# SSD1306 OLED display
CONFIG_DISPLAY=y
CONFIG_SSD1306=y
CONFIG_CHARACTER_FRAMEBUFFER=y
CONFIG_HEAP_MEM_POOL_SIZE=8192

# HTTP Server for REST API and Web UI
CONFIG_HTTP_SERVER=y
CONFIG_HTTP_SERVER_RESOURCE_WILDCARD=y
CONFIG_HTTP_SERVER_MAX_CLIENTS=4
CONFIG_HTTP_SERVER_MAX_URL_LENGTH=256
CONFIG_HTTP_SERVER_CLIENT_BUFFER_SIZE=2048
CONFIG_HTTP_SERVER_CLIENT_INACTIVITY_TIMEOUT=30
CONFIG_NET_BUF_DATA_SIZE=512
CONFIG_NET_MAX_CONN=24
CONFIG_NET_MAX_CONTEXTS=24
CONFIG_EVENTFD=y
CONFIG_ZVFS_EVENTFD_MAX=6
CONFIG_ZVFS_OPEN_MAX=32
CONFIG_ZVFS_POLL_MAX=32
CONFIG_POSIX_API=y
CONFIG_NET_PKT_RX_COUNT=48
CONFIG_NET_PKT_TX_COUNT=48
CONFIG_NET_BUF_RX_COUNT=128
CONFIG_NET_BUF_TX_COUNT=128
CONFIG_NET_CONTEXT_NET_PKT_POOL=y
CONFIG_NET_TCP_TIME_WAIT_DELAY=0

# Limit TCP windows to prevent buffer exhaustion on the slow
# byte-at-a-time FPGA ethernet interface.  Without this, TCP
# tries to fill all available net_bufs in flight, starving RX.
CONFIG_NET_TCP_MAX_SEND_WINDOW_SIZE=4096
CONFIG_NET_TCP_MAX_RECV_WINDOW_SIZE=4096

# SD Card storage via SPI
CONFIG_SPI=y
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVER_SDMMC=y
CONFIG_SDHC=y
CONFIG_SDHC_INIT_PRIORITY=50

# SD initialization tuning
CONFIG_SD_INIT_TIMEOUT=5000
CONFIG_SD_OCR_RETRY_COUNT=3000
CONFIG_SD_CMD_TIMEOUT=500
CONFIG_SD_CMD_RETRIES=5
CONFIG_SD_DATA_RETRIES=5

# SD debug logging (comment out after debugging)
CONFIG_SDHC_LOG_LEVEL_DBG=n
CONFIG_SD_LOG_LEVEL_DBG=n

# FAT filesystem
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_MOUNT_MKFS=y
CONFIG_FS_FATFS_MKFS=y
CONFIG_FS_FATFS_LFN=y
CONFIG_FS_FATFS_LFN_MODE_HEAP=y
CONFIG_FS_FATFS_MAX_LFN=64
CONFIG_FS_FATFS_CODEPAGE=850

# SD Config module
CONFIG_SD_CONFIG=y

# SPI Flash Config module (fallback when no SD card)
CONFIG_FLASH_CONFIG=y

# System reboot support
CONFIG_REBOOT=y

# SPI NOR Flash in-system firmware update
CONFIG_SPI_FLASH_LITESPI=y
# RAVENNA RTSP Server/Client for stream control
CONFIG_RTSP=y
CONFIG_RTSP_AUTO_START=y
CONFIG_RTSP_PORT=554
CONFIG_RTSP_MAX_SESSIONS=8
CONFIG_RTSP_MAX_CLIENTS=4

# RAVENNA mDNS/DNS-SD service advertisement
CONFIG_MDNS_RESPONDER=y
CONFIG_MDNS_RESPONDER_PROBE=n
CONFIG_DNS_SD=y
CONFIG_MDNS_RESPONDER_DNS_SD=y
CONFIG_MDNS_RESPONDER_DNS_SD_SERVICE_TYPE_ENUMERATION=y
CONFIG_NET_HOSTNAME_ENABLE=y
CONFIG_NET_HOSTNAME_DYNAMIC=y
CONFIG_NET_HOSTNAME="aes67node"
CONFIG_DNS_RESOLVER=y
CONFIG_DNS_RESOLVER_AUTO_INIT=n
CONFIG_DNS_RESOLVER_MAX_NAME_LEN=128
CONFIG_DNS_NUM_CONCUR_QUERIES=4
CONFIG_MDNS_SD=y

# Entropy (board-specific; see boards/*.conf)

#CONFIG_LOG_MODE_IMMEDIATE=y
#CONFIG_PRINTK=y
#CONFIG_EARLY_CONSOLE=y
CONFIG_DISPLAY_CTRL_NUM_CHANNELS=24