# Board-neutral AES67 app config. Anything board-specific lives in
# boards/<board>.conf (automatically merged by Zephyr when that board
# is selected).

# ---- Shell & logging ----
CONFIG_SHELL=y
CONFIG_LOG=y
CONFIG_EARLY_CONSOLE=y
CONFIG_PRINTK=y

# ---- Threads / stacks ----
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_NAME=y

# main.c reads cb->info in the DHCP-bound event handler. Was previously
# selected implicitly by NET_CONNECTION_MANAGER (dropped — unused).
CONFIG_NET_MGMT_EVENT_INFO=y
