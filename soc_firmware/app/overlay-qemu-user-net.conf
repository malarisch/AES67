# Optional overlay for the QEMU targets: SLIRP user-mode networking
# instead of the default TAP ("zeth") setup. No root/net-tools needed —
# QEMU's built-in DHCP hands the guest 10.0.2.15 and the host reaches
# the HTTP/NMOS APIs through the port forward below.
#
#   west build -b qemu_riscv64 -d build_qemu -- \
#       -DEXTRA_CONF_FILE=overlay-qemu-user-net.conf
#   west build -d build_qemu -t run
#   curl http://127.0.0.1:18080/x-nmos/
#
# Limitations vs. TAP: no inbound mDNS/SAP multicast — discovery and the
# nmos-testing suites need the TAP setup (net-tools' net-setup.sh).
CONFIG_NET_QEMU_USER=y
CONFIG_NET_QEMU_USER_EXTRA_ARGS="hostfwd=tcp::18080-:80"
