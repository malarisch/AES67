# AES67 LiteX VexRiscv (Arrow CYC1000 / SDRAM) — full control-plane build.
#
# Currently identical to the cyclone10 board. RAM footprint is tighter
# (4 MB vs 8 MB) — adjust pool/buffer sizes here if the firmware stops
# fitting.

# ---- Software PRNG (no HW RNG on VexRiscv) ----
CONFIG_ENTROPY_GENERATOR=y
CONFIG_TEST_RANDOM_GENERATOR=y

# ---- Networking ----
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV4=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_DHCPV6=n
CONFIG_NET_UDP=y
CONFIG_NET_TCP=y
CONFIG_NET_STATISTICS=y
CONFIG_NET_LOG=y
CONFIG_NET_DHCPV4_LOG_LEVEL_INF=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_IPV4_IGMP=y
# Multicast group slots per netif (default is only 2!):
# all-systems + mDNS + SAP + PTP proxy + up to 8 RX audio streams = 12.
CONFIG_NET_IF_MCAST_IPV4_ADDR_COUNT=16
CONFIG_NET_IF_MAX_IPV4_COUNT=1
# Two unicast slots: the manual link-local fallback address (main.c) and a
# DHCP lease live on the interface at the same time. NB: NET_IPV4_AUTO used
# to default this to 2; with autoconf off it silently falls back to 1 and
# the DHCP client can never bind its lease (no free slot).
CONFIG_NET_IF_UNICAST_IPV4_ADDR_COUNT=2
CONFIG_NET_SHELL=y

# Net pools sized for HTTP + RTSP + multicast PTP/SAP.
CONFIG_NET_PKT_RX_COUNT=128
CONFIG_NET_PKT_TX_COUNT=128
CONFIG_NET_BUF_RX_COUNT=256
CONFIG_NET_BUF_TX_COUNT=256
CONFIG_NET_BUF_DATA_SIZE=1024
CONFIG_NET_MAX_CONN=24
CONFIG_NET_MAX_CONTEXTS=24
CONFIG_NET_CONTEXT_NET_PKT_POOL=y
CONFIG_NET_TCP_TIME_WAIT_DELAY=0
# Limit TCP windows: the byte-at-a-time FPGA MAC would otherwise starve RX.
CONFIG_NET_TCP_MAX_SEND_WINDOW_SIZE=4096
CONFIG_NET_TCP_MAX_RECV_WINDOW_SIZE=4096

# ---- LiteX Ethernet + FPGA HAL ----
CONFIG_ETH_LITEX=y
CONFIG_ETH_LITEX_MAC_ADDR="02:1C:23:17:AC:AC"
CONFIG_FPGA_HAL=y
CONFIG_FPGA_HAL_LITEX=y
CONFIG_ETHERNET_LOG_LEVEL_INF=y

# ---- Si5351A clock generator + analog cards (I2C) ----
CONFIG_I2C=y
CONFIG_I2C_SHELL=y
CONFIG_SI5351A=y
CONFIG_MI_CARD=y
CONFIG_LO_CARD=y
CONFIG_IO_CARD=y

# ---- Front-panel display controller (UART-attached LEDs/buttons/7seg) ----
CONFIG_UART_INTERRUPT_DRIVEN=n
CONFIG_DISPLAY_CTRL=y
CONFIG_DISPLAY_CTRL_NUM_CHANNELS=24

# ---- SSD1306 OLED (off by default, flip here when the panel is populated) ----
CONFIG_DISPLAY=n
CONFIG_SSD1306=n
CONFIG_CHARACTER_FRAMEBUFFER=n

# ---- HTTP server (REST + web UI) ----
CONFIG_HTTP_SERVER=y
CONFIG_HTTP_SERVER_RESOURCE_WILDCARD=y
CONFIG_HTTP_SERVER_MAX_CLIENTS=4
CONFIG_HTTP_SERVER_MAX_URL_LENGTH=256
CONFIG_HTTP_SERVER_CLIENT_BUFFER_SIZE=2048
CONFIG_HTTP_SERVER_CLIENT_INACTIVITY_TIMEOUT=30
CONFIG_EVENTFD=y
CONFIG_ZVFS_EVENTFD_MAX=6
CONFIG_ZVFS_OPEN_MAX=32
CONFIG_ZVFS_POLL_MAX=32
CONFIG_POSIX_API=y

# ---- SD card storage over LiteX SPI ----
CONFIG_SPI=y
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVER_SDMMC=y
CONFIG_SDHC=y
CONFIG_SDHC_INIT_PRIORITY=50
CONFIG_SD_INIT_TIMEOUT=5000
CONFIG_SD_OCR_RETRY_COUNT=3000
CONFIG_SD_CMD_TIMEOUT=500
CONFIG_SD_CMD_RETRIES=5
CONFIG_SD_DATA_RETRIES=5

# ---- FAT filesystem on SD ----
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_MOUNT_MKFS=y
CONFIG_FS_FATFS_MKFS=y
CONFIG_FS_FATFS_LFN=y
CONFIG_FS_FATFS_LFN_MODE_HEAP=y
CONFIG_FS_FATFS_MAX_LFN=64
CONFIG_FS_FATFS_CODEPAGE=850

# ---- Config storage (SD first, SPI flash fallback) + firmware update ----
CONFIG_SD_CONFIG=y
CONFIG_FLASH_CONFIG=y
# The cyc1000 SoC boots the BIOS XIP from flash, so its SPI master port
# lives in the BIOS-invisible "spiflash_ctrl" CSR bank (instead of
# "spiflash_master"); spi_flash.c maps the names. Write access works
# once Zephyr runs from SDRAM.
CONFIG_SPI_FLASH_LITESPI=y
CONFIG_REBOOT=y

# ---- RAVENNA: RTSP + mDNS/DNS-SD ----
CONFIG_RTSP=y
CONFIG_RTSP_AUTO_START=y
CONFIG_RTSP_PORT=554
CONFIG_RTSP_MAX_SESSIONS=8
CONFIG_RTSP_MAX_CLIENTS=4
# Zephyr's mDNS responder is replaced by the app's own mdns_sd module
# (CONFIG_MDNS_SD below): RAVENNA needs DNS-SD subtype queries
# (_ravenna_session._sub._rtsp._tcp) which Zephyr cannot answer, and both
# would fight over UDP 5353.
CONFIG_MDNS_RESPONDER=n
CONFIG_NET_HOSTNAME_ENABLE=y
CONFIG_NET_HOSTNAME_DYNAMIC=y
CONFIG_NET_HOSTNAME="aes67node"
CONFIG_DNS_RESOLVER=y
CONFIG_DNS_RESOLVER_AUTO_INIT=n
CONFIG_DNS_RESOLVER_MAX_NAME_LEN=128
CONFIG_DNS_NUM_CONCUR_QUERIES=4
CONFIG_MDNS_SD=y

# Heap needs to be larger with networking + HTTP + mDNS active.
CONFIG_HEAP_MEM_POOL_SIZE=8192

CONFIG_LOG_BUFFER_SIZE=8192
CONFIG_SHELL_BACKEND_SERIAL_RX_RING_BUFFER_SIZE=1024
CONFIG_SHELL_BACKEND_SERIAL_TX_RING_BUFFER_SIZE=1024

# ---- PTP: both services in one image, runtime-selected ----
# The FPGA-BMC path (ptp_bmc.c) and Zephyr's IEEE 1588 stack (CONFIG_PTP)
# are both always built (CONFIG_AES67_PTP_SOFTWARE defaults to y); at boot
# the firmware reads the gateware's static build configuration (system_cfg
# CSRs) and starts the matching one. The Zephyr stack must therefore not
# auto-start via SYS_INIT — main.c calls ptp_start() only when the loaded
# bitstream reports PTP_IN_SOFTWARE (Zephyr patch 0016):
CONFIG_PTP=y
CONFIG_PTP_APP_MANAGED_START=y
CONFIG_PTP_CLOCK=y
CONFIG_NET_PKT_TIMESTAMP=y

# The PTP thread itself transmits Announce/Sync/Delay_Req, and with
# NET_TC_TX_COUNT=0 that is the whole UDP/IP/driver TX path on ITS stack.
# The Zephyr default of 2048 overflowed on the ESP32 (silent halt under
# deferred logging); size every build the same so the hunt never repeats.
CONFIG_PTP_STACK_SIZE=8192

# The cooperative tx_tstamp thread runs the PTP egress-timestamp callbacks.
# As leader, port_sync_timestamp_cb sends the Follow_Up from that context,
# and with NET_TC_TX_COUNT=0 that is the entire UDP/IP/driver TX path on
# the Kconfig-default 1 KiB stack: random stack-overflow panics.
CONFIG_NET_PKT_TIMESTAMP_STACK_SIZE=4096

# Moving-median prefilters (linuxptp-style): path-delay spikes from
# asymmetric queuing and single bad timestamps are rejected before the
# servo or the step logic sees them.
CONFIG_PTP_PATH_DELAY_FILTER_LENGTH=9
CONFIG_PTP_OFFSET_FILTER_LENGTH=5

# ---- Net-stack thread stacks (2026-07-27) ----
# Measured high-water on cyc1000 with the Kconfig DEFAULTS left in place:
# net_socket_service 1084/1200 (90%!), net_mgmt 580/800 (72%),
# tcp_work 724/1024 (70%), rx_q[0] 1044/1792 (58%), logging 436/768 (56%).
# High-water understates the worst case: the deepest chains (ARP log in the
# TCP retransmit path, DHCP rebind + carrier teardown in net_mgmt, and with
# NET_TC_TX_COUNT=0 the whole TX path on the caller's stack) may simply not
# have run yet — the same lesson already learned the hard way on the ESP32,
# where exactly these four are 4096. RISC-V frames are roughly half of
# Xtensa's windowed ABI, and RAM is plentiful, so size with real headroom.
CONFIG_NET_SOCKETS_SERVICE_STACK_SIZE=2048
CONFIG_NET_MGMT_EVENT_STACK_SIZE=2048
CONFIG_NET_TCP_WORKQ_STACK_SIZE=2048
CONFIG_NET_RX_STACK_SIZE=3072
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=1024
# Catch a runaway stack loudly (per-switch sentinel check) instead of
# silently corrupting the neighbour region — already standard on the ESP32.
CONFIG_STACK_SENTINEL=y

# ---- HTTP server client slots (2026-07-27) ----
# Browsers park up to 6 idle keep-alive connections; each occupies a client
# slot until the 30 s inactivity timeout, and with all slots taken the
# server stops polling its listen socket (new connections hang/reset).
# The default of 4 was starved by ONE browser tab. Costs ~2.5 KB RAM per
# extra slot — plentiful here.
CONFIG_HTTP_SERVER_MAX_CLIENTS=8

# ---- PTP servo tuning (2026-07-27) ----
# Mirrors the hardware-validated ESP32 setup. Without this the stack ran
# the upstream PI defaults (700/300), which are tuned for 1 Hz sync — at
# the AES67 8 Hz rate the loop is barely damped and the wallclock rate
# correction rang at +-80000 ppb second over second (seen on cyc1000).
CONFIG_PTP_SERVO_KP=200
CONFIG_PTP_SERVO_KI=10
# Adaptive linear-regression servo (linuxptp port, patch 0007) instead of
# the PI controller, with the robust offset outlier gate: one corrupted RX
# timestamp otherwise poisons the 64-point regression window for ~8 s.
CONFIG_PTP_SERVO_LINREG=y
CONFIG_PTP_OFFSET_OUTLIER_FILTER=y
# Media-clock damping: slew residual phase out at <= 2 ppm instead of
# commanding large temporary frequency excursions.
CONFIG_PTP_SERVO_PHASE_CORR_MAX_PPB=2000
# Priority-mark PTP event traffic.
CONFIG_PTP_DSCP_HIGH_PRIORITY=y
CONFIG_PTP_DSCP_NONE_PRIORITY=n
