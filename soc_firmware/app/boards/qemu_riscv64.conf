# AES67 control plane on QEMU (riscv64 virt) — CI / development build
# without hardware: virtio-net NIC (QEMU TAP "zeth", see zephyr
# net-tools) and the FPGA HAL mock backend emulating the aes67_bridge
# register map.
#
# Run:  west build -b qemu_riscv64 -d build_qemu
#       west build -d build_qemu -t run
# Host side: net-tools' `net-setup.sh` provides the zeth TAP interface.

# ---- Software PRNG ----
CONFIG_ENTROPY_GENERATOR=y
CONFIG_TEST_RANDOM_GENERATOR=y

# ---- Networking ----
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV4=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_DHCPV6=n
CONFIG_NET_UDP=y
CONFIG_NET_TCP=y
CONFIG_NET_STATISTICS=y
CONFIG_NET_LOG=y
CONFIG_NET_DHCPV4_LOG_LEVEL_INF=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_IPV4_IGMP=y
# all-systems + mDNS + SAP + PTP proxy + up to 8 RX audio streams.
CONFIG_NET_IF_MCAST_IPV4_ADDR_COUNT=16
CONFIG_NET_IF_MAX_IPV4_COUNT=1
# Link-local fallback + DHCP lease coexist (see prj.conf).
CONFIG_NET_IF_UNICAST_IPV4_ADDR_COUNT=2
CONFIG_NET_SHELL=y

CONFIG_NET_PKT_RX_COUNT=48
CONFIG_NET_PKT_TX_COUNT=48
CONFIG_NET_BUF_RX_COUNT=128
CONFIG_NET_BUF_TX_COUNT=128
CONFIG_NET_BUF_DATA_SIZE=512
CONFIG_NET_MAX_CONN=24
CONFIG_NET_MAX_CONTEXTS=24
CONFIG_NET_CONTEXT_NET_PKT_POOL=y
CONFIG_NET_TCP_TIME_WAIT_DELAY=0

# ---- QEMU virtio-net NIC (enabled via devicetree) + FPGA HAL mock ----
CONFIG_FPGA_HAL=y
CONFIG_FPGA_HAL_MOCK=y
CONFIG_ETHERNET_LOG_LEVEL_INF=y

# ---- HTTP server (REST + web UI + NMOS) ----
CONFIG_HTTP_SERVER=y
CONFIG_HTTP_SERVER_RESOURCE_WILDCARD=y
CONFIG_HTTP_SERVER_MAX_CLIENTS=8
CONFIG_HTTP_SERVER_MAX_URL_LENGTH=256
CONFIG_HTTP_SERVER_CLIENT_BUFFER_SIZE=2048
CONFIG_HTTP_SERVER_CLIENT_INACTIVITY_TIMEOUT=30
CONFIG_EVENTFD=y
CONFIG_ZVFS_EVENTFD_MAX=6
CONFIG_ZVFS_OPEN_MAX=32
CONFIG_ZVFS_POLL_MAX=32
CONFIG_POSIX_API=y

# ---- RAVENNA: RTSP + mDNS/DNS-SD ----
CONFIG_RTSP=y
CONFIG_RTSP_AUTO_START=y
CONFIG_RTSP_PORT=554
CONFIG_RTSP_MAX_SESSIONS=8
CONFIG_RTSP_MAX_CLIENTS=4
CONFIG_MDNS_RESPONDER=n
CONFIG_NET_HOSTNAME_ENABLE=y
CONFIG_NET_HOSTNAME_DYNAMIC=y
CONFIG_NET_HOSTNAME="aes67node"
CONFIG_DNS_RESOLVER=y
CONFIG_DNS_RESOLVER_AUTO_INIT=n
CONFIG_DNS_RESOLVER_MAX_NAME_LEN=128
CONFIG_DNS_NUM_CONCUR_QUERIES=4
CONFIG_MDNS_SD=y

CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_REBOOT=y

# ---- PTP ----
# No CONFIG_PTP: the mock reports hardware PTP, so only the FPGA-BMC
# path (ptp_bmc, plain UDP against the mock CSRs) runs. The Zephyr
# IEEE 1588 stack needs the aes67 PHC driver (eth_litex), which does
# not exist on this board.

# ---- Net-stack thread stacks (mirrors the LiteX/ESP32 sizing) ----
# socket_service measured at 91 % of 2048 on this target (rv64 frames).
CONFIG_NET_SOCKETS_SERVICE_STACK_SIZE=4096
CONFIG_NET_MGMT_EVENT_STACK_SIZE=2048
CONFIG_NET_TCP_WORKQ_STACK_SIZE=2048
CONFIG_NET_RX_STACK_SIZE=3072
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=1024
CONFIG_STACK_SENTINEL=y
