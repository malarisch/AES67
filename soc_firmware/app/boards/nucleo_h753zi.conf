# STM32H753ZI board-specific Kconfig
# FMC Ethernet bridge to FPGA
CONFIG_ETH_FMC_BASIC=y
CONFIG_ETH_STM32_HAL=n
CONFIG_ETH_FMC_BASIC_RX_STACK_SIZE=4096

# Cache management for DMA
CONFIG_NOCACHE_MEMORY=y

# FMC controller for FPGA memory-mapped access
CONFIG_MEMC=y
CONFIG_MEMC_STM32=y
CONFIG_MEMC_STM32_NOR_PSRAM=y

# STM32 has hardware entropy
CONFIG_ENTROPY_GENERATOR=y

# FPGA HAL — FMC backend
CONFIG_FPGA_HAL=y
CONFIG_FPGA_HAL_FMC=y
