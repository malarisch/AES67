# ESP32-S3 DevKitC (N16R8), PROCPU — AES67 FPGA SPI control plane.

# Bring up only the pieces needed to talk to the FPGA over SPI.
CONFIG_GPIO=y
CONFIG_SPI=y

CONFIG_FPGA_SPI=y
CONFIG_FPGA_HAL=y
CONFIG_FPGA_HAL_SPI=y

# No networking / HTTP / mDNS / RTSP / SD / display on this board yet;
# those features live in the LiteX boards' .conf so they stay out of the
# ESP32 build by default.

# PSRAM (N16R8 has 8 MB octal PSRAM). Disabled for now: the SPI bring-up
# does not need it, and the default init assumes quad PSRAM, which fails
# on N16R8. Re-enable with:
#   CONFIG_ESP_SPIRAM=y
#   CONFIG_ESP_SPIRAM_MODE_OCT=y
#   CONFIG_ESP_SPIRAM_SPEED_80M=y
# once PSRAM is actually needed.
CONFIG_ESP_SPIRAM=n
