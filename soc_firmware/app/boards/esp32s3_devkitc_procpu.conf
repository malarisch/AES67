# ESP32-S3 DevKitC (N16R8) — AES67 control plane over SPI to the FPGA.
#
# Mirrors the LiteX cyclone10 build for everything that's portable
# (HTTP, RTSP, mDNS/SD, SAP/SDP, PTP BMC, DHCP). Hardware that only
# exists on the LiteX board (Si5351A clock generator, analog I/O cards,
# display controller, on-FPGA SD card / SPI flash) stays disabled —
# main.c gates those code paths on the matching Kconfigs.

# ---- Bus and FPGA control ----
CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_I2C=y

CONFIG_SPIBONE=y
CONFIG_FPGA_HAL=y
CONFIG_FPGA_HAL_SPI=y
# Backstop only — RX is IRQ-paced. Keep it tight anyway: a lost edge then
# costs at most 100 ms instead of 500, and a probe is one ~30 µs SPI read.
CONFIG_ETH_SPI_POLL_INTERVAL_MS=100

# ---- Ethernet over SPI + networking ----
CONFIG_ETH_SPI=y
CONFIG_NET_DHCPV4_SERVER=y
# The SPI link drains one frame at a time; absorb TCP bursts in the TX
# queue instead of dropping (-ENOMEM) under webserver load.
CONFIG_ETH_SPI_TX_QUEUE_DEPTH=32
CONFIG_ETH_SPI_LOG_LEVEL_DBG=n
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV4=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_DHCPV6=n
CONFIG_NET_UDP=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_IF_MAX_IPV4_COUNT=1
CONFIG_NET_IPV4_IGMP=y
# Multicast group slots per netif (default is only 2!):
# all-systems + mDNS + SAP + PTP proxy + up to 8 RX audio streams = 12.
CONFIG_NET_IF_MCAST_IPV4_ADDR_COUNT=16
CONFIG_NET_LOG=y
CONFIG_NET_SHELL=y
# The DHCP-bound handler runs in the net_mgmt thread and writes the FPGA IP
# CSR through the whole spibone/SPI driver chain — the 768 B default is tight.
CONFIG_NET_MGMT_EVENT_STACK_SIZE=2048
CONFIG_NET_STATISTICS=y
CONFIG_NET_DHCPV4_LOG_LEVEL_INF=y

# Net pools sized for HTTP + RTSP + multicast PTP/SAP. The pools live in
# PSRAM (see ESP32_WIFI_NET_ALLOC_SPIRAM below), so they can be generous:
# the SPI link drains slowly and bursts of TCP segments queue up here.
CONFIG_NET_PKT_RX_COUNT=256
CONFIG_NET_PKT_TX_COUNT=48
CONFIG_NET_BUF_RX_COUNT=128
CONFIG_NET_BUF_TX_COUNT=96
CONFIG_NET_BUF_DATA_SIZE=1532
CONFIG_NET_MAX_CONN=24
CONFIG_NET_MAX_CONTEXTS=24
CONFIG_NET_CONTEXT_NET_PKT_POOL=y
CONFIG_NET_TCP_TIME_WAIT_DELAY=0
CONFIG_NET_TCP_MAX_SEND_WINDOW_SIZE=4096
CONFIG_NET_TCP_MAX_RECV_WINDOW_SIZE=8192

# Catch thread stack overflows as a clean fatal error instead of the
# silent Xtensa double-exception lockup (cheap: one sentinel check per
# context switch). Bring-up safety net after the fpga_poll overflow.
CONFIG_STACK_SENTINEL=y

# Run the net traffic-class threads — and, keyed off the same choice, the
# HTTP server thread — preemptive instead of cooperative. With the default
# (cooperative) the HTTP server runs at K_PRIO_COOP and can never be
# preempted by the application's preemptive threads; its handlers do long
# spibone CSR reads per request, and on releasing the bus mutex a coop
# thread keeps running and immediately re-takes it — at a 100 ms web-UI
# refresh the display metering/status threads (P10/P12) starve on the bus
# and the front panel freezes. Preemptive: TC threads land high (~P7,
# packets stay snappy), the HTTP server at the lowest priority (P14),
# below every display/app thread.
CONFIG_NET_TC_THREAD_PREEMPTIVE=y

# ---- HTTP server (REST + web UI) ----
CONFIG_HTTP_SERVER=y
CONFIG_HTTP_SERVER_RESOURCE_WILDCARD=y
CONFIG_HTTP_SERVER_MAX_CLIENTS=4
CONFIG_HTTP_SERVER_MAX_URL_LENGTH=256
CONFIG_HTTP_SERVER_CLIENT_BUFFER_SIZE=2048
CONFIG_HTTP_SERVER_CLIENT_INACTIVITY_TIMEOUT=30
CONFIG_EVENTFD=y
CONFIG_ZVFS_EVENTFD_MAX=6
CONFIG_ZVFS_OPEN_MAX=32
CONFIG_ZVFS_POLL_MAX=32
CONFIG_POSIX_API=y

# ---- RAVENNA: RTSP + mDNS/DNS-SD ----
CONFIG_RTSP=y
CONFIG_RTSP_AUTO_START=y
CONFIG_RTSP_PORT=554
CONFIG_RTSP_MAX_SESSIONS=8
CONFIG_RTSP_MAX_CLIENTS=4
# Zephyr's mDNS responder is replaced by the app's own mdns_sd module
# (CONFIG_MDNS_SD below): RAVENNA needs DNS-SD subtype queries
# (_ravenna_session._sub._rtsp._tcp) which Zephyr cannot answer, and both
# would fight over UDP 5353.
CONFIG_MDNS_RESPONDER=n
CONFIG_NET_HOSTNAME_ENABLE=y
CONFIG_NET_HOSTNAME_DYNAMIC=y
CONFIG_NET_HOSTNAME="aes67node"
CONFIG_DNS_RESOLVER=y
CONFIG_DNS_RESOLVER_AUTO_INIT=n
CONFIG_DNS_RESOLVER_MAX_NAME_LEN=128
CONFIG_DNS_NUM_CONCUR_QUERIES=4
CONFIG_MDNS_SD=y

# Heap needs to be larger with networking + HTTP + mDNS active.
CONFIG_HEAP_MEM_POOL_SIZE=16384

# Webserver exposes a /api/system/reboot endpoint.
CONFIG_REBOOT=y

# ---- Analog cards (ADDA) ----
# The ADDA (IO card, CS5368 ADCs + DACs) hangs on the ESP directly:
# control via i2c0 (labelled i2c2 in the overlay, where main.c/card
# manager expect the card bus) and nRST via the adda_nrst GPIO node
# (fpga_hal_spi.c drives it instead of the FPGA CSR bit).
CONFIG_IO_CARD=y

# ---- Front-panel display controller (UART-attached LEDs/buttons/7seg) ----
# On uart1 (alias display-ctrl-uart, TX=GPIO17/RX=GPIO18). The shared
# nRST line uses the GPIO backend: alias dc-nrst points at the same
# adda_nrst node fpga_hal_spi drives (one physical line resets both the
# display controller and the ADDA card, as on the LiteX boards).
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_DISPLAY_CTRL=y
CONFIG_DISPLAY_CTRL_NUM_CHANNELS=24
CONFIG_DISPLAY_CTRL_NRST_GPIO=y

# ---- Disabled on this board ----
# No on-board Si5351A, no MI/LO cards, no on-FPGA SPI flash,
# no SD card. Keep these explicit so the defaults in app Kconfig
# don't accidentally pull them in.
CONFIG_SI5351A=n
CONFIG_MI_CARD=y
CONFIG_LO_CARD=y
CONFIG_SPI_FLASH_LITESPI=n
CONFIG_SD_CONFIG=n

# ---- Config persistence in the ESP32's own program flash ----
# flash_config's flash-map backend puts the two 8 KB A/B config slots at
# the start of the 192 KB "storage" partition (0x3b0000, Espressif AMP
# partition table). Writes go through the esp32 flash controller driver,
# which suspends the XIP cache around erase/program.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_CONFIG=y
# The N16R8 module has 16 MB flash; the Zephyr default of 2 MB would be
# stamped into the image header, and esp_flash derives its usable chip
# size (erase/write bounds) from that header.
CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y

# ---- PSRAM (N16R8: 8 MB octal) ----
# The default quad-mode init fails on octal parts — SPIRAM_MODE_OCT is
# mandatory on this module. The net stack's packet slabs and net_buf data
# pools move to PSRAM via ESP32_WIFI_NET_ALLOC_SPIRAM (symbol extended in
# the app Kconfig — the linker placement works without WiFi), which frees
# ~90 KB of internal DRAM and lets the pools above be sized generously.
CONFIG_ESP_SPIRAM=y
CONFIG_SPIRAM_MODE_OCT=y
CONFIG_SPIRAM_SPEED_80M=y
CONFIG_ESP32_WIFI_NET_ALLOC_SPIRAM=y



CONFIG_PTP=y
CONFIG_PTP_CLOCK=y
CONFIG_NET_PKT_TIMESTAMP=y
CONFIG_AES67_PTP_SOFTWARE=y

# The cooperative tx_tstamp thread runs the PTP egress-timestamp callbacks.
# As leader, port_sync_timestamp_cb sends the Follow_Up from that context,
# and with NET_TC_TX_COUNT=0 that is the entire UDP/IP/driver TX path —
# including the full spibone SPI chain — on the Kconfig-default 1 KiB
# stack: random stack-overflow panics. Size it for that deepest chain.
CONFIG_NET_PKT_TIMESTAMP_STACK_SIZE=4096

# PI servo gains (thousandths). The upstream defaults (700/300) are tuned for
# a 1 Hz sync interval; at the AES67 8 Hz rate they leave the loop barely
# damped (|z|≈0.96, ~4 s ringing) — visible as PPS frequency wander on a
# scope even with ns-level reported offsets. Softer gains trade lock speed
# (tens of seconds) for a clean, stable frequency.
CONFIG_PTP_SERVO_KP=200
CONFIG_PTP_SERVO_KI=10

# Moving-median prefilters (linuxptp-style). Path-delay spikes from
# asymmetric queuing and single bad timestamps are rejected before the
# servo or the step logic sees them. At the AES67 8 Hz sync rate the
# offset filter adds ~0.3 s of response lag — irrelevant next to the
# soft servo gains above.
CONFIG_PTP_PATH_DELAY_FILTER_LENGTH=9
CONFIG_PTP_OFFSET_FILTER_LENGTH=5

CONFIG_PTP_DSCP_HIGH_PRIORITY=y
CONFIG_PTP_DSCP_NONE_PRIORITY=n
CONFIG_PTP_SERVO_LINREG=y

# Robust offset outlier gate (default-on, listed for documentation): rejects
# samples deviating > 8x the tracked noise (floor 5 µs) from the moving
# median before they reach linreg. Guards against corrupted RX timestamps
# whose path delay looks normal — one such sample poisons the 64-point
# regression window for ~8 s (seen as ±200k ppb bursts, 2026-07-23).
CONFIG_PTP_OFFSET_OUTLIER_FILTER=y
# Media-clock damping: linreg slews residual phase out at <= 2 ppm instead
# of commanding large temporary frequency excursions.
CONFIG_PTP_SERVO_PHASE_CORR_MAX_PPB=2000
CONFIG_AES67_FPGA_JTAG_BOOT_LOAD=y