# ESP32-S3 DevKitC (N16R8) — AES67 SPI control plane + Ethernet over SPI.

# ---- Bus and FPGA control ----
CONFIG_GPIO=y
CONFIG_SPI=y

CONFIG_FPGA_SPI=y
CONFIG_FPGA_HAL=y
CONFIG_FPGA_HAL_SPI=y

# ---- Ethernet over SPI + minimal network stack ----
CONFIG_ETH_SPI=y
CONFIG_ETH_SPI_LOG_LEVEL_DBG=y
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV4=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_UDP=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_CONNECTION_MANAGER=y
CONFIG_NET_IF_MAX_IPV4_COUNT=1
CONFIG_NET_IPV4_IGMP=y
CONFIG_NET_LOG=y
CONFIG_NET_SHELL=y
CONFIG_NET_STATISTICS=y

# Net pools sized for simple bring-up (not HTTP/RTSP yet).
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=32
CONFIG_NET_BUF_TX_COUNT=32
CONFIG_NET_BUF_DATA_SIZE=512

# PSRAM disabled: N16R8 uses octal PSRAM and the default driver init
# assumes quad, which fails. Re-enable with:
#   CONFIG_ESP_SPIRAM=y
#   CONFIG_ESP_SPIRAM_MODE_OCT=y
#   CONFIG_ESP_SPIRAM_SPEED_80M=y
# once PSRAM is actually needed.
CONFIG_ESP_SPIRAM=n
