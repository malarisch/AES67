# ESP32-S3 DevKitC (N16R8) — AES67 control plane over SPI to the FPGA.
#
# Mirrors the LiteX cyclone10 build for everything that's portable
# (HTTP, RTSP, mDNS/SD, SAP/SDP, PTP BMC, DHCP). Hardware that only
# exists on the LiteX board (Si5351A clock generator, analog I/O cards,
# display controller, on-FPGA SD card / SPI flash) stays disabled —
# main.c gates those code paths on the matching Kconfigs.

# ---- Bus and FPGA control ----
CONFIG_GPIO=y
CONFIG_SPI=y

CONFIG_SPIBONE=y
CONFIG_FPGA_HAL=y
CONFIG_FPGA_HAL_SPI=y
# Backstop only — RX is IRQ-paced. Keep it tight anyway: a lost edge then
# costs at most 100 ms instead of 500, and a probe is one ~30 µs SPI read.
CONFIG_ETH_SPI_POLL_INTERVAL_MS=100

# ---- Ethernet over SPI + networking ----
CONFIG_ETH_SPI=y
CONFIG_NET_DHCPV4_SERVER=y
# The SPI link drains one frame at a time; absorb TCP bursts in the TX
# queue instead of dropping (-ENOMEM) under webserver load.
CONFIG_ETH_SPI_TX_QUEUE_DEPTH=32
CONFIG_ETH_SPI_LOG_LEVEL_DBG=n
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV4=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_DHCPV6=n
CONFIG_NET_UDP=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_IF_MAX_IPV4_COUNT=1
CONFIG_NET_IPV4_IGMP=y
# Multicast group slots per netif (default is only 2!):
# all-systems + mDNS + SAP + PTP proxy + up to 8 RX audio streams = 12.
CONFIG_NET_IF_MCAST_IPV4_ADDR_COUNT=16
CONFIG_NET_LOG=y
CONFIG_NET_SHELL=y
# The DHCP-bound handler runs in the net_mgmt thread and writes the FPGA IP
# CSR through the whole spibone/SPI driver chain — the 768 B default is tight.
CONFIG_NET_MGMT_EVENT_STACK_SIZE=2048
CONFIG_NET_STATISTICS=y
CONFIG_NET_DHCPV4_LOG_LEVEL_INF=y

# Net pools sized for HTTP + RTSP + multicast PTP/SAP. The pools live in
# PSRAM (see ESP32_WIFI_NET_ALLOC_SPIRAM below), so they can be generous:
# the SPI link drains slowly and bursts of TCP segments queue up here.
CONFIG_NET_PKT_RX_COUNT=48
CONFIG_NET_PKT_TX_COUNT=48
CONFIG_NET_BUF_RX_COUNT=96
CONFIG_NET_BUF_TX_COUNT=96
CONFIG_NET_BUF_DATA_SIZE=1532
CONFIG_NET_MAX_CONN=24
CONFIG_NET_MAX_CONTEXTS=24
CONFIG_NET_CONTEXT_NET_PKT_POOL=y
CONFIG_NET_TCP_TIME_WAIT_DELAY=0
CONFIG_NET_TCP_MAX_SEND_WINDOW_SIZE=4096
CONFIG_NET_TCP_MAX_RECV_WINDOW_SIZE=4096

# ---- HTTP server (REST + web UI) ----
CONFIG_HTTP_SERVER=y
CONFIG_HTTP_SERVER_RESOURCE_WILDCARD=y
CONFIG_HTTP_SERVER_MAX_CLIENTS=4
CONFIG_HTTP_SERVER_MAX_URL_LENGTH=256
CONFIG_HTTP_SERVER_CLIENT_BUFFER_SIZE=2048
CONFIG_HTTP_SERVER_CLIENT_INACTIVITY_TIMEOUT=30
CONFIG_EVENTFD=y
CONFIG_ZVFS_EVENTFD_MAX=6
CONFIG_ZVFS_OPEN_MAX=32
CONFIG_ZVFS_POLL_MAX=32
CONFIG_POSIX_API=y

# ---- RAVENNA: RTSP + mDNS/DNS-SD ----
CONFIG_RTSP=y
CONFIG_RTSP_AUTO_START=y
CONFIG_RTSP_PORT=554
CONFIG_RTSP_MAX_SESSIONS=8
CONFIG_RTSP_MAX_CLIENTS=4
# Zephyr's mDNS responder is replaced by the app's own mdns_sd module
# (CONFIG_MDNS_SD below): RAVENNA needs DNS-SD subtype queries
# (_ravenna_session._sub._rtsp._tcp) which Zephyr cannot answer, and both
# would fight over UDP 5353.
CONFIG_MDNS_RESPONDER=n
CONFIG_NET_HOSTNAME_ENABLE=y
CONFIG_NET_HOSTNAME_DYNAMIC=y
CONFIG_NET_HOSTNAME="aes67node"
CONFIG_DNS_RESOLVER=y
CONFIG_DNS_RESOLVER_AUTO_INIT=n
CONFIG_DNS_RESOLVER_MAX_NAME_LEN=128
CONFIG_DNS_NUM_CONCUR_QUERIES=4
CONFIG_MDNS_SD=y

# Heap needs to be larger with networking + HTTP + mDNS active.
CONFIG_HEAP_MEM_POOL_SIZE=16384

# Webserver exposes a /api/system/reboot endpoint.
CONFIG_REBOOT=y

# ---- Disabled on this board ----
# No on-board Si5351A, no analog cards, no display controller,
# no on-FPGA SPI flash, no SD card. Keep these explicit so the
# defaults in app Kconfig don't accidentally pull them in.
CONFIG_SI5351A=n
CONFIG_MI_CARD=n
CONFIG_LO_CARD=n
CONFIG_IO_CARD=n
CONFIG_DISPLAY_CTRL=n
CONFIG_SPI_FLASH_LITESPI=n
CONFIG_SD_CONFIG=n
CONFIG_FLASH_CONFIG=n

# ---- PSRAM (N16R8: 8 MB octal) ----
# The default quad-mode init fails on octal parts — SPIRAM_MODE_OCT is
# mandatory on this module. The net stack's packet slabs and net_buf data
# pools move to PSRAM via ESP32_WIFI_NET_ALLOC_SPIRAM (symbol extended in
# the app Kconfig — the linker placement works without WiFi), which frees
# ~90 KB of internal DRAM and lets the pools above be sized generously.
CONFIG_ESP_SPIRAM=y
CONFIG_SPIRAM_MODE_OCT=y
CONFIG_SPIRAM_SPEED_80M=y
CONFIG_ESP32_WIFI_NET_ALLOC_SPIRAM=y



CONFIG_PTP=y
CONFIG_PTP_CLOCK=y
CONFIG_NET_PKT_TIMESTAMP=y
CONFIG_AES67_PTP_SOFTWARE=y

# PI servo gains (thousandths). The upstream defaults (700/300) are tuned for
# a 1 Hz sync interval; at the AES67 8 Hz rate they leave the loop barely
# damped (|z|≈0.96, ~4 s ringing) — visible as PPS frequency wander on a
# scope even with ns-level reported offsets. Softer gains trade lock speed
# (tens of seconds) for a clean, stable frequency.
CONFIG_PTP_SERVO_KP=100
CONFIG_PTP_SERVO_KI=10
