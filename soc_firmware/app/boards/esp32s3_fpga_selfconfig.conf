# ESP32-S3 node whose FPGA configures itself from its own flash (e.g. Tang
# Primer 20K / Gowin). Layer on top of the default ESP32 config:
#
#   west build -b esp32s3_devkitc/esp32s3/procpu -- \
#       -DEXTRA_CONF_FILE=boards/esp32s3_fpga_selfconfig.conf
#
# The JTAG loader only handles the Altera (Quartus SVF) flow and needs the
# ESP's JTAG GPIOs wired to the FPGA. The default image copes without that
# wiring too (dead chain but spibone answers -> boot continues without JTAG
# management); this overlay just drops the driver outright: no embedded
# bitstream, no chain scan at boot, no health monitor, no `fpga jtag` shell
# command.
CONFIG_AES67_FPGA_JTAG=n
# Override the base config's BOOT_LOAD=y, else Kconfig warns about the
# now-unmet dependency.
CONFIG_AES67_FPGA_JTAG_BOOT_LOAD=n
