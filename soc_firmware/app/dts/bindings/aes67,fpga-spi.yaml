# SPDX-License-Identifier: Apache-2.0
# Binding for the AES67 on-FPGA spictrl slave as seen by an external MCU.
# Uses the standard spi-device properties (freq/duplex/frame-format).

description: AES67 FPGA SPI control slave

compatible: "aes67,fpga-spi"

include:
  - name: spi-device.yaml

properties:
  int-gpios:
    type: phandle-array
    required: false
    description: |
      GPIO line driven by the FPGA `mcu_irq_o` output. Active-high while
      an RX Ethernet frame is waiting in the FPGA RX buffer. Used by the
      eth_spi driver; when absent the driver falls back to polling.
