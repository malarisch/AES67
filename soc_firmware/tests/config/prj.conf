CONFIG_ZTEST=y

# aes67_conn / config_json use net_if, IGMP and the socket address
# helpers. No interface is started; the tests drive the tables directly.
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_IPV4_IGMP=y
CONFIG_NET_IF_MCAST_IPV4_ADDR_COUNT=16

# Same register-map emulation the QEMU firmware image runs against.
CONFIG_FPGA_HAL=y
CONFIG_FPGA_HAL_MOCK=y
CONFIG_FPGA_HAL_MOCK_GOLDFISH_RTC=n

CONFIG_MAIN_STACK_SIZE=8192
CONFIG_ZTEST_STACK_SIZE=8192
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y

# Zephyr JSON library: config persistence and the REST request bodies
# are described as descriptor tables (config_json.c, webapi/).
CONFIG_JSON_LIBRARY=y

# QEMU networking backend: SLIRP (user-mode NAT), not a host TAP device.
# The NET_QEMU_NETWORKING choice has no "none" option, and on this board
# it falls through to NET_QEMU_ETHERNET, which wires QEMU to a host TAP
# named "zeth". On any machine without that interface — every CI runner,
# since the TAP is only set up later for the NMOS step — QEMU exits
# within milliseconds and twister reports the run as "unexpected eof"
# with no further explanation. These suites never bring an interface up;
# they only need the networking types and the address helpers.
CONFIG_NET_QEMU_USER=y
