CONFIG_ZTEST=y

# fpga_regs writes the interface MAC/IP, so it needs the net types.
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y

CONFIG_FPGA_HAL=y
CONFIG_FPGA_HAL_MOCK=y
# Free-running epoch instead of QEMU's Goldfish RTC: the wallclock tests
# assert monotonicity and latch coherence, not agreement with host time.
CONFIG_FPGA_HAL_MOCK_GOLDFISH_RTC=n

# Deliberately not the defaults — the system_cfg test proves the parsed
# stream/channel limits really come from the emulated CSRs.
CONFIG_FPGA_HAL_MOCK_TX_STREAMS=4
CONFIG_FPGA_HAL_MOCK_TX_CHANNELS=6
CONFIG_FPGA_HAL_MOCK_RX_STREAMS=3
CONFIG_FPGA_HAL_MOCK_RX_CHANNELS=16

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_ZTEST_STACK_SIZE=4096

# QEMU networking backend: SLIRP (user-mode NAT), not a host TAP device.
# The NET_QEMU_NETWORKING choice has no "none" option, and on this board
# it falls through to NET_QEMU_ETHERNET, which wires QEMU to a host TAP
# named "zeth". On any machine without that interface — every CI runner,
# since the TAP is only set up later for the NMOS step — QEMU exits
# within milliseconds and twister reports the run as "unexpected eof"
# with no further explanation. These suites never bring an interface up;
# they only need the networking types and the address helpers.
CONFIG_NET_QEMU_USER=y
